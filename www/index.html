<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiffin Ledger</title>
<meta name="theme-color" content="#3a2a8c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f5f2fc;--card:#fff;--ink:#1a1240;--mute:#6a6490;--line:#e1dcf2;--gold:#e9a820;--steel:#3a2a8c;--ok:#0f8a6d;--bad:#c2274b;--okbg:#dff5ee;--badbg:#fde4ea;--goldbg:#fbf0d2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#100b26;--card:#1b1540;--ink:#f4f0ff;--mute:#a79fd0;--line:#2f2761;--steel:#b3a4ff;--okbg:#103a31;--badbg:#43182a;--goldbg:#3a2f12}}
:root[data-theme="dark"]{--bg:#100b26;--card:#1b1540;--ink:#f4f0ff;--mute:#a79fd0;--line:#2f2761;--steel:#b3a4ff;--okbg:#103a31;--badbg:#43182a;--goldbg:#3a2f12}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs,17px)/1.5 "Bricolage Grotesque",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:28px;font-weight:800;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);font-weight:600;font-size:13px;font-family:inherit;padding:8px 2px;cursor:pointer;border-top:3px solid transparent}
nav button.on{color:var(--ink);border-top-color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:24px;font-weight:800}
.stat span{color:var(--mute);font-size:13px}
.stat.hot{background:var(--badbg)}.stat.good{background:var(--okbg)}.stat.gold{background:var(--goldbg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card.done{border-left:5px solid var(--ok)}.card.owes{border-left:5px solid var(--bad)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.name{font-weight:800;font-size:1.2em}label{font-weight:600;font-size:.9em;display:grid;gap:4px}
.m{color:var(--mute);font-size:14px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--goldbg)}
.tag.bad{background:var(--badbg);color:var(--bad)}.tag.ok{background:var(--okbg);color:var(--ok)}
button.b{font:600 .95em "Bricolage Grotesque",system-ui,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:48px}
button.b.pri{background:var(--steel);color:#fff;border-color:var(--steel)}
button.b.on{background:var(--ok);color:#fff;border-color:var(--ok)}
button.b.gold{background:var(--gold);border-color:var(--gold);color:#241a00}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.qty span{min-width:22px;text-align:center;font-weight:800;font-size:20px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.form{display:grid;gap:8px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{color:var(--mute);text-align:center;padding:26px 10px;border:1px dashed var(--line);border-radius:12px}
.date{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.date input{width:auto}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
.sec{font-size:1.1em;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.tag{font-size:.85em;padding:4px 10px;margin:2px 4px 2px 0}
.badges{margin-top:8px}
.banner{background:var(--okbg);color:var(--ok);border-radius:12px;padding:14px;font-weight:800;text-align:center;margin-bottom:10px}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#dlg[hidden],#toast[hidden]{display:none}
#dlg .box{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:400px;display:grid;gap:10px}
#dlg h2{margin:0;font-size:1.15em}
#toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;font-weight:600;z-index:30;text-align:center}
.big{flex:1}
input[type=search]{font-size:1em}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:10px 16px;font:600 .95em inherit;font-family:inherit;cursor:pointer;min-height:44px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#241a00}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:280px;background:linear-gradient(180deg,rgba(90,67,214,.18),rgba(90,67,214,0));pointer-events:none;z-index:-1}
h1{color:var(--steel);letter-spacing:-.02em}
h1::after{content:"";display:block;width:58px;height:5px;border-radius:9px;margin-top:6px;background:linear-gradient(90deg,var(--gold),rgba(233,168,32,0))}
.card{box-shadow:0 1px 2px rgba(42,28,110,.07),0 12px 28px -16px rgba(42,28,110,.4);transition:transform .2s,box-shadow .2s}
.card:active{transform:scale(.992)}
.stat{border-top:4px solid var(--line);box-shadow:0 1px 2px rgba(42,28,110,.07),0 12px 28px -18px rgba(42,28,110,.4)}
.stat.gold{border-top-color:var(--gold)}.stat.good{border-top-color:var(--ok)}.stat.hot{border-top-color:var(--bad)}
.stat b{color:var(--steel)}.stat.good b{color:var(--ok)}.stat.hot b{color:var(--bad)}
nav{box-shadow:0 -10px 28px -14px rgba(42,28,110,.45)}
nav button{transition:color .2s}
nav button span{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
nav button.on{color:var(--steel);border-top-color:var(--gold)}
nav button.on span{transform:translateY(-2px) scale(1.18)}
button{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
button.b,.chip,.qty button{transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,background .2s}
button.b:active,.chip:active,.qty button:active{transform:scale(.92)}
button.b.pri,.chip.on{background:linear-gradient(135deg,#5a43d6,#2f1f80);border-color:#2f1f80;color:#fff;box-shadow:0 8px 18px -8px rgba(47,31,128,.85)}
button.b.on{background:linear-gradient(135deg,#17a583,#0f8a6d);border-color:#0f8a6d;color:#fff}
button.b.gold{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 72%,#fff),var(--gold));border-color:var(--gold);color:#241a00;font-weight:800}
.banner{background:linear-gradient(110deg,var(--okbg) 30%,rgba(255,255,255,.65) 50%,var(--okbg) 70%);background-size:240% 100%;border:1px solid var(--ok)}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
.cf{position:fixed;z-index:50;pointer-events:none;border-radius:2px}
@keyframes rp{to{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:no-preference){
.enter .card,.enter .stat,.enter .chip,.enter .banner,.enter .sec,.enter .tx{animation:rise .6s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:var(--d,0ms)}
.enter h1::after{animation:grow .9s .1s ease-out both}
.card.pop{animation:popin .7s cubic-bezier(.2,1.4,.4,1),ring 1.1s ease-out}
.card.pop .tag{animation:tagIn .5s cubic-bezier(.3,1.7,.5,1) both}
.qty span.bump{animation:bump .45s cubic-bezier(.3,1.8,.5,1)}
nav button.hop span{animation:hop .55s cubic-bezier(.3,1.8,.5,1)}
#dlg{animation:fade .2s ease-out}
#dlg .box{animation:dlgIn .4s cubic-bezier(.2,1.3,.4,1)}
#toast{animation:toastIn .45s cubic-bezier(.2,1.5,.4,1)}
.banner{animation:shine 3.2s linear infinite}
.empty{animation:floaty 3.4s ease-in-out infinite}
.b.pri.big::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);animation:sheen 4.6s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes popin{0%{transform:scale(.94)}50%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(15,138,109,.6)}100%{box-shadow:0 0 0 24px rgba(15,138,109,0)}}
@keyframes tagIn{from{opacity:0;transform:scale(.4) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(.5) translateY(10px);opacity:.3}60%{transform:scale(1.45)}100%{transform:scale(1)}}
@keyframes hop{0%{transform:translateY(8px) scale(.7)}60%{transform:translateY(-9px) scale(1.32)}100%{transform:translateY(-2px) scale(1.18)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes dlgIn{from{opacity:0;transform:translateY(34px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(26px) scale(.9)}to{opacity:1;transform:none}}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes floaty{50%{transform:translateY(-6px)}}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
}
#dlg{top:auto;bottom:calc(70px + env(safe-area-inset-bottom,0px));left:0;right:0;background:none;display:block;padding:0 10px;pointer-events:none}
#dlg .box{pointer-events:auto;max-width:560px;margin:0 auto;gap:10px;padding:10px 16px 16px;border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:22px 22px 18px 18px;max-height:min(60vh,520px);overflow:auto;box-shadow:0 -12px 36px -10px rgba(42,28,110,.5),0 18px 36px -12px rgba(0,0,0,.25)}
.grab{display:block;width:42px;height:4px;border-radius:9px;background:var(--line);margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
#dlg h2{margin:0;font-size:1.1em;color:var(--steel)}
.x{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mute);font-size:14px;cursor:pointer}
#dlg .acts{margin-top:2px}
#toast{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;max-width:560px;margin:0 auto;background:linear-gradient(135deg,#3a2a8c,#24175f);color:#fff;border-left:4px solid var(--gold);box-shadow:0 14px 30px -12px rgba(36,23,95,.8)}
@media (prefers-reduced-motion:no-preference){
#dlg .box{animation:sheetIn .4s cubic-bezier(.2,1.15,.4,1)}
#toast{animation:toastDown .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes sheetIn{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
@keyframes toastDown{from{opacity:0;transform:translateY(-30px) scale(.92)}to{opacity:1;transform:none}}
}
.tx{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(42,28,110,.06),0 10px 22px -16px rgba(42,28,110,.4)}
.ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:21px;flex:none}
.ico.ok{background:var(--okbg)}.ico.bad{background:var(--badbg)}
.tb{flex:1;min-width:0}.tb>b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-size:1.15em;white-space:nowrap}.amt.ok{color:var(--ok)}.amt.bad{color:var(--bad)}
.sec .tag{margin-left:auto}
.pbtn{display:inline-block;margin-top:6px;padding:6px 12px;min-height:34px;border-radius:99px;border:1px dashed var(--gold);background:var(--goldbg);color:var(--ink);font:600 .85em "Bricolage Grotesque",system-ui,sans-serif;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.pbtn:active{transform:scale(.93)}
.pbtn.custom{border-style:solid;background:var(--gold);color:#241a00}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav"></nav><div id="dlg" hidden></div><div id="toast" role="status" hidden></div>
<script>
var KEY="tiffin-ledger-v1",S,tab="today",day=today();
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return{price:80,cust:[],cooks:[],days:{},pays:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(window.toast)toast("⚠️ Could not save. Storage may be full or blocked.")}}
S=load();var DEFSET={name:"My Tiffin Service",cur:"₹",accent:"#e9a820",theme:"auto",size:17};S.set=Object.assign({},DEFSET,S.set||{});
function pr(c){return S.price}
function applySet(){document.title=S.set.name;var r=document.documentElement;r.style.setProperty("--gold",S.set.accent);r.style.setProperty("--fs",S.set.size+"px");if(S.set.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.set.theme)}
function setSet(k,x){S.set[k]=x;save();applySet();render()}
var COL=["#e9a820","#c2274b","#0f8a6d","#2f5fd0","#7b3fe4","#d6336c"];
function opts(a,cur){return a.map(function(o){return'<option value="'+o[0]+'"'+(cur===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join("")}
function restore(){try{var o=JSON.parse(v("bk"));if(!o.cust)throw 0;S=o;S.set=Object.assign({},DEFSET,S.set||{});migrate();initMt();save();applySet();render()}catch(e){toast("That backup text is not valid.")}}
function viewSet(){var s=S.set,h='<h1>Settings</h1><p class="sub">Make the app yours.</p>';
h+='<div class="card form"><label>Business name<input value="'+esc(s.name)+'" onchange="setSet(\'name\',this.value.trim()||DEFSET.name)"></label><div class="grid2"><label>Currency symbol<input value="'+esc(s.cur)+'" maxlength="3" onchange="setSet(\'cur\',this.value||DEFSET.cur)"></label></div></div>';
h+=mealsCard();h+='<div class="card form"><b>Look and feel</b><div class="acts">'+COL.map(function(c){return'<button class="b" aria-label="Colour '+c+'" style="background:'+c+';width:52px;border:'+(c===s.accent?'4px solid var(--ink)':'1px solid var(--line)')+'" onclick="setSet(\'accent\',\''+c+'\')"></button>'}).join("")+'</div><label>Light or dark<select onchange="setSet(\'theme\',this.value)">'+opts([["auto","Match my phone"],["light","Light"],["dark","Dark"]],s.theme)+'</select></label><label>Text size<select onchange="setSet(\'size\',+this.value)">'+opts([[15,"Small"],[17,"Normal"],[19,"Large"],[22,"Extra large"]],String(s.size)).replace('value="'+s.size+'"','value="'+s.size+'" selected')+'</select></label></div>';
h+='<div class="card form"><b>Backup</b><span class="m">Tap Show my backup, copy the text and keep it safe. Paste it here later to restore.</span><textarea id="bk" rows="4" style="width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)"></textarea><div class="acts"><button class="b" onclick="document.getElementById(\'bk\').value=JSON.stringify(S)">Show my backup</button><button class="b pri" onclick="restore()">Restore from text</button><button class="b" onclick="wipe()">Erase everything</button></div></div>';
return h}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function inr(n){return S.set.cur+Math.round(n).toLocaleString("en-IN")}
function rows(d){return S.days[d]||(S.days[d]={})}
function find(id){return S.cust.filter(function(c){return c.id===id})[0]}
function v(i){return document.getElementById(i).value}
function dateBar(){return '<div class="date"><input type="date" value="'+day+'" onchange="day=this.value||today();render()" aria-label="Date"><button class="b" onclick="day=today();render()">Today</button></div>'}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.hidden=false;t.style.animation="none";void t.offsetWidth;t.style.animation="";clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3500)}
function ask(m,ok,cb){dlg(m,"",ok,function(){cb()})}
function wipe(){ask("Erase ALL customers, cooks and records? This cannot be undone.","Erase everything",function(){S={price:80,meals:DEFMEALS(),cust:[],cooks:[],days:{},pays:[],set:Object.assign({},DEFSET)};initMt();save();applySet();render()})}
var q="";
function hit(c){var t=q.trim().toLowerCase(),d=t.replace(/\D/g,"");if(!t)return true;return c.name.toLowerCase().indexOf(t)>-1||(d!==""&&(c.phone||"").indexOf(d)>-1)}
function searchBox(){return '<input type="search" id="q" placeholder="🔍 Search by name or phone number" value="'+esc(q)+'" oninput="q=this.value;upd()" aria-label="Search by name or phone number" style="margin-bottom:12px">'}
function upd(){var l=document.getElementById("list");if(l)l.innerHTML=tab==="hist"?(document.getElementById("hs").innerHTML=histTiles(),histList()):tab==="cust"?custList():tab==="debt"?debtList():todayList()}
var tabs=[["today","🍱","Today"],["cust","👥","Customers"],["debt","💸","Debt"],["hist","🧾","History"],["set","⚙️","Settings"]];
function debtItems(){return S.cust.map(function(c){return{c:c,o:owed(c)}}).filter(function(x){return x.o>0}).sort(function(a,b){return b.o-a.o})}
function debtList(){var h="";debtItems().filter(function(x){return hit(x.c)}).forEach(function(x){var c=x.c,old=c.due||0,u=x.o-old;
 h+='<div class="card owes"><div class="row"><div><div class="name">'+esc(c.name)+'</div><div class="m"><a href="tel:'+esc(c.phone||"")+'">'+esc(c.phone||"No phone")+'</a></div></div><b style="font-size:1.4em;color:var(--bad)">'+inr(x.o)+'</b></div><div class="badges">'+(old>0?'<span class="tag bad">Old balance '+inr(old)+'</span>':'')+(u>0?'<span class="tag bad">Unpaid tiffins '+inr(u)+'</span>':'')+'</div><div class="acts"><button class="b gold big" onclick="debtFull(\''+c.id+'\')">✅ Receive full '+inr(x.o)+'</button><button class="b big" onclick="debtPart(\''+c.id+'\')">⚠️ Receive part</button></div></div>'});
 return h||'<div class="empty">No one matches your search.</div>'}
function viewDebt(){var L=debtItems(),t=0;L.forEach(function(x){t+=x.o});
 var h='<h1>Debt</h1><p class="sub">Everyone who owes you money.</p><div class="stats"><div class="stat hot"><b>'+inr(t)+'</b><span>Total owed to you</span></div><div class="stat"><b>'+L.length+'</b><span>'+(L.length===1?'Person owes':'People owe')+' you</span></div></div>';
 if(!L.length)return h+'<div class="empty">🎉 Nobody owes you anything.</div>';
 return h+searchBox()+'<div id="list">'+debtList()+'</div>'}
var mt="all";
function DEFMEALS(){return[{id:"l",name:"Lunch",emoji:"☀️",price:80},{id:"e",name:"Dinner",emoji:"🌙",price:70}]}
function migrate(){S.days=S.days||{};S.pays=S.pays||[];S.cust=S.cust||[];if(!S.meals||!S.meals.length){S.meals=DEFMEALS();S.meals[0].price=S.price||80;S.v2=1}
 if(!S.v2){S.meals=S.meals.filter(function(m){return!(m.id==="b"&&m.name==="Breakfast")});S.meals.forEach(function(m){if(m.id==="e"&&m.name==="Evening")m.name="Dinner"});S.v2=1}
 S.cust.forEach(function(c){if(!c.meals){c.meals={l:c.qty||0}}});
 for(var d in S.days){var o=S.days[d];for(var k in o)if(k.indexOf("|")<0){o[k+"|l"]=o[k];o[k].m="l";delete o[k]}}
 for(var d in S.days){var o=S.days[d],n=0;for(var k in o){var r=o[k];if(!r.qty&&!r.del&&!r.paid&&!r.short)delete o[k];else n++}if(!n)delete S.days[d]}}
function mget(m){return S.meals.filter(function(z){return z.id===m})[0]}

 if(L.length>hl)h+='<button class="b big" style="width:100%" onclick="hl+=80;upd()">Show more ('+(L.length-hl)+' left)</button>';return h}
function chipRow(a,cur,v){return'<div class="chips">'+a.map(function(o){return'<button class="chip '+(cur===o[0]?"on":"")+'" onclick="'+v+'=\''+o[0]+'\';hl=80;render()">'+o[1]+'</button>'}).join("")+'</div>'}
function viewHist(){return'<h1>History</h1><p class="sub">Every payment and delivery, newest first.</p>'+chipRow([["today","Today"],["week","7 days"],["month","30 days"],["all","All time"]],hr,"hr")+chipRow([["all","All"],["cash","💵 Cash"],["online","📱 Online"],["debt","🧾 Debt collected"],["due","⏳ Not paid"]],hf,"hf")+'<div id="hs">'+histTiles()+'</div>'+searchBox()+'<div id="list">'+histList()+'</div><button class="b" style="width:100%;margin-top:10px" onclick="exportCSV()">📋 Export these entries</button>'}
function up(r){return r.pr>0?r.pr:mp(r.m)}
function priceSheet(k){var u=unitK(k),c=u.c,x=row(day,c,u.m);if(x.paid)return toast("Undo the payment first to change the price.");
 dlg("Price for "+esc(c.name)+" · "+me(u.m)+" "+esc(mn(u.m)),'<label>Price per tiffin ('+esc(S.set.cur)+')<input id="pp" type="number" min="1" value="'+up(x)+'"></label><p class="m" style="margin:0">Normal price: '+inr(mp(u.m))+'. Choose how long this price applies.</p><div class="acts"><button class="b pri big" onclick="savePrice(\''+k+'\',0)">Today only</button><button class="b pri big" onclick="savePrice(\''+k+'\',1)">Always for '+esc(c.name)+'</button></div><button class="b" onclick="resetPrice(\''+k+'\')">↺ Use the normal price</button>',"Close",function(){})}
function savePrice(k,always){var u=unitK(k),c=u.c,x=row(day,c,u.m),p=parseFloat(v("pp"));if(!(p>0))return toast("Enter a price above 0.");
 x.pr=p;x.amt=x.qty*p;if(always){c.prices=c.prices||{};c.prices[u.m]=p}save();closeDlg();fx=k;render();toast("✓ "+c.name+" now pays "+inr(p)+" per tiffin"+(always?" from now on":" today"))}
function resetPrice(k){var u=unitK(k),c=u.c,x=row(day,c,u.m);x.pr=0;x.amt=x.qty*mp(u.m);if(c.prices)delete c.prices[u.m];save();closeDlg();render();toast("Back to the normal price: "+inr(mp(u.m)))}
function ph10(p){return String(p).slice(-10)}
function bill(x){return x.amt+(x.short||0)}
function askPay(k){var u=unitK(k),c=u.c,x=row(day,c,u.m);if(x.late)return toast("This was paid from the Debt tab, so it can't be changed here.");var b=bill(x);dlg("Payment from "+esc(c.name),'<p class="m" style="margin:0">'+me(u.m)+' '+esc(mn(u.m))+' · Bill '+inr(b)+(x.paid?' · now '+(x.paid==="online"?"online":"cash")+' '+inr(x.amt):'')+'</p><div class="acts" style="flex-direction:column"><button class="b pri big" onclick="payFull(\''+k+'\')">✅ Receive full money ('+inr(b)+')</button><button class="b big" onclick="payLess(\''+k+'\')">⚠️ Receive incomplete / do not receive</button></div>',x.paid?"Keep as it is":"Decide later",function(){})}
function payFull(k){var u=unitK(k),x=row(day,u.c,u.m);dlg("Full money received: "+inr(bill(x)),'<p class="m" style="margin:0">How was it paid?</p><div class="acts"><button class="b pri big" onclick="setPay(\''+k+'\',\'online\',\'full\')">📱 Online</button><button class="b pri big" onclick="setPay(\''+k+'\',\'cash\',\'full\')">💵 Cash</button></div>',"Back",function(){askPay(k);return false})}
function payLess(k){var u=unitK(k),x=row(day,u.c,u.m),b=bill(x);dlg("Incomplete payment",'<label>Amount received ('+esc(S.set.cur)+')<input id="pa" type="number" min="1" max="'+b+'" placeholder="e.g. '+Math.floor(b/2)+'"></label><p class="m" style="margin:0">Bill: '+inr(b)+'. The rest is added to their debt.</p><div class="acts"><button class="b pri big" onclick="setPay(\''+k+'\',\'online\')">📱 Online</button><button class="b pri big" onclick="setPay(\''+k+'\',\'cash\')">💵 Cash</button></div><button class="b" onclick="noPay(\''+k+'\')">🚫 Did not receive anything</button>',"Back",function(){askPay(k);return false})}
function noPay(k){var u=unitK(k),x=row(day,u.c,u.m);if(x.paid||x.short)unpay(u.c,x);closeDlg();save();render();toast("Nothing received. "+inr(x.amt)+" stays as debt for "+u.c.name+".")}
function setPay(k,mode,amt){var u=unitK(k),c=u.c,r=row(day,c,u.m),b=bill(r),a=amt==="full"?b:parseFloat(v("pa"));if(!(a>0))return toast("Enter the amount received, or tap Did not receive anything.");if(a>b)return toast("The bill is "+inr(b)+". Use the Debt tab to collect older money.");
 if(r.paid||r.short)unpay(c,r);var sh=Math.round((r.amt-a)*100)/100;if(sh>0){c.due=(c.due||0)+sh;r.short=sh;r.amt=a}r.paid=mode;r.pt=Date.now();fx=k;save();closeDlg();render();burst(lp.x,lp.y,sh>0?10:28);toast("✓ "+inr(a)+" received "+(mode==="online"?"online":"in cash")+(sh>0?" · "+inr(sh)+" added to debt":""))}
function undoDel(k){var u=unitK(k),c=u.c;if(row(day,c,u.m).late)return toast("This was settled from the Debt tab, so delivery can't be undone here.");ask("Undo delivery for "+esc(c.name)+" ("+esc(mn(u.m))+")? This also clears its payment.","Undo delivery",function(){var r=row(day,c,u.m);unpay(c,r);r.del=false;save();render()})}
function del(kind,id){var c=find(id),o=c?owed(c):0;ask("Remove "+esc(c?c.name:"this customer")+"?"+(o>0?" They still owe "+inr(o)+", which will be lost.":""),"Remove",function(){S.cust=S.cust.filter(function(x){return x.id!==id});save();render()})}
function exportCSV(){var L=events().filter(hOK),R2=[["Date","Time","Customer","Phone","Type","Meal","Mode","Amount"]];L.forEach(function(e){R2.push([e.d,e.t?new Date(e.t).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}):"",e.c?e.c.name:"Removed customer",e.c?e.c.phone||"":"",e.ty==="meal"?"Payment":e.ty==="debt"?"Debt collected":"Not paid",e.m?mn(e.m):"",e.ty==="due"?"":(e.mode==="online"?"Online":"Cash"),e.amt])});
 var t=R2.map(function(r){return r.map(function(x){return'"'+String(x).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
 dlg("Export "+L.length+" entries",'<textarea id="csv" rows="6" readonly style="width:100%;font:inherit;font-size:.8em;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)"></textarea><p class="m" style="margin:0">Tap Copy, then paste into WhatsApp, Notes or a spreadsheet.</p>',"Copy",function(){var a=document.getElementById("csv");a.select();try{document.execCommand("copy");toast("Copied to clipboard")}catch(e){toast("Select the text and copy it manually")}return false});document.getElementById("csv").value=t}
function render(){var f={today:viewToday,cust:viewCust,debt:viewDebt,hist:viewHist,set:viewSet};
 var a=document.activeElement&&document.activeElement.id;
 var key=tab+"|"+mt+"|"+day,ch=key!==rK;document.getElementById("app").innerHTML=f[tab]();
 document.getElementById("nav").innerHTML=tabs.map(function(t){return'<button class="'+(t[0]===tab?'on'+(ch&&rK?' hop':''):'')+'" onclick="tab=\''+t[0]+'\';q=\'\';render();scrollTo(0,0)">'+'<span style="display:block;font-size:22px">'+t[1]+'</span>'+t[2]+'</button>'}).join("");enhance(ch);rK=key;fx=null;fq=null}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDlg()});
migrate();initMt();applySet();render();
</script>
</body>
